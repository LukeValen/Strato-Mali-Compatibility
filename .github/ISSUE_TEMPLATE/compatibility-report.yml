name: Compatibility report
description: Share your Strato Mali test. Reports appear on the list after review.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Your report will be public on GitHub. Do not include ROMs, keys, personal information or download links. After review, the team adds `compatibility-approved` to publish it.
  - type: input
    id: game-name
    attributes:
      label: Game
      placeholder: "e.g. NieR:Automata The End of YoRHa Edition"
    validations:
      required: true
  - type: input
    id: title-id
    attributes:
      label: Title ID
      description: The base game's 16-character hexadecimal Title ID.
      placeholder: "0100B8E016F76000"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Mali GPU
      placeholder: "Mali-G615 MC6 or Mali-G720"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Vulkan driver
      placeholder: "Arm 44.1.0"
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: Strato Mali version
      placeholder: "0.0.4-2 or build hash"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Choose the stage reached on this GPU and version.
      options:
        - Playable
        - In-game
        - Boots
        - Nothing
        - Unplayable
    validations:
      required: true
  - type: dropdown
    id: stars
    attributes:
      label: Rating
      description: 0 means it did not work; 5 means a great experience. The rating is independent of the status.
      options:
        - 0 stars
        - 1 star
        - 2 stars
        - 3 stars
        - 4 stars
        - 5 stars
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Describe approximate FPS, bugs, crash timing and special options, if relevant.
      placeholder: "e.g. 30 FPS in the first stage, no texture glitches; BCn compute enabled."
    validations:
      required: true
