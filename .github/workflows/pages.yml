name: Publish compatibility list
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: compatibility-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test review parser
        run: python3 -m unittest discover -s tests
      - name: Build static site and approved data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js dist/
          cp data/games.json dist/data/
          python3 scripts/build_data.py dist/data/reviews.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
